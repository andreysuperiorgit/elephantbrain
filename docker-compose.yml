services:
  elephantbrain:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      # keep the database on the volume, not in the container layer
      EB_MEMORY_PATH: /data/memory.db
      # the follow-up loop is what teaches the memory; leave it on
      EB_FOLLOWUP: "on"
      EB_FOLLOWUP_MINUTES: "30"
    volumes:
      - elephantbrain-memory:/data
    restart: unless-stopped

volumes:
  elephantbrain-memory:
